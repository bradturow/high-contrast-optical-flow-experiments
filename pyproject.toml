[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high-contrast-optical-flow-experiments"
version = "0.1.0"
description = "Reproducible experiments for a topological model of high-contrast optical flow."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Brad Turow" }]
dependencies = [
  "circle-bundles[notebooks,optical-flow,viz] @ git+https://github.com/bradturow/Circle_Bundles.git@9dcb901b6895bf13b7a586ab5a0c9fc895ace583",
  "numpy",
  "pandas",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
